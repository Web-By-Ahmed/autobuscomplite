<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أتوبيس كومبليت 🚌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    :root {
      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 24px 0 16px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .letter-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .current-letter {
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
      margin: 10px 0;
    }

    .letter-label {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
    }

    button {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .timer-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .timer {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--success);
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field input {
      font-family: 'Cairo', sans-serif;
      font-size: 1.1rem;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      text-align: right;
      direction: rtl;
      background: #0f172a;
      color: var(--text);
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .field input.valid {
      border-color: var(--success);
      background: rgba(52, 211, 153, 0.1);
    }

    .field input.invalid {
      border-color: var(--danger);
      background: rgba(248, 113, 113, 0.1);
    }

    .field .hint {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 18px;
    }

    .field .hint.ok {
      color: var(--success);
    }

    .field .hint.err {
      color: var(--danger);
    }

    .result-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .result-box.show {
      display: block;
    }

    .result-box.success {
      background: rgba(52, 211, 153, 0.15);
      color: #6ee7b7;
      border: 2px solid #34d399;
    }

    .result-box.partial {
      background: rgba(251, 191, 36, 0.15);
      color: #fcd34d;
      border: 2px solid #fbbf24;
    }

    .result-box.fail {
      background: rgba(248, 113, 113, 0.15);
      color: #fca5a5;
      border: 2px solid #f87171;
    }

    .letters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .letter-btn {
      aspect-ratio: 1;
      border-radius: 12px;
      background: #0f172a;
      border: 2px solid var(--border);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .letter-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--primary);
    }

    .letter-btn.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }

    .suggestions {
      margin-top: 16px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed var(--border);
      display: none;
    }

    .suggestions.show {
      display: block;
    }

    .suggestions h4 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: var(--muted);
    }

    .sug-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sug-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sug-item:hover {
      background: #e0f2fe;
      border-color: var(--primary);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .how-to {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .how-to ol {
      padding-right: 20px;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.7rem;
      }
      .current-letter {
        font-size: 3.5rem;
      }
      .card {
        padding: 18px;
      }
    }
  </style>
</head>

        <div class="form-grid">

          </div>

          <div class="field">
            <label>📦 جماد</label>

            <div class="hint" id="hint-object"></div>
          </div>
          <div class="field">
            <label>🌿 نبات</label>
            <input type="text" id="plant" placeholder="" autocomplete="off">
            <div class="hint" id="hint-plant"></div>
          </div>
          <div class="field">
            <label>🌍 بلد</label>
            <input type="text" id="country" placeholder="" autocomplete="off">
            <div class="hint" id="hint-country"></div>
          </div>
        </div>

        <div class="controls" style="margin-top:24px;">
          <button class="btn-success" id="submit-btn" onclick="checkAnswers()">
            🚌 أتوبيس كومبليت
          </button>
        </div>

        <div class="result-box" id="result-box"></div>
      </div>
    </div>
  </div>

      "و": {

        girl: ["وداد", "وفاء", "ودى", "وسام"],
        animal: ["وطواط", "وز"],
        object: ["ورقة", "قلم", "وسادة"],
        plant: ["ورد", "ونيلة"],
        country: ["واشنطن", "ويلز"]
      },
      "ي": {
        boy: ["ياسر", "يوسف", "يحيى", "يامن"],
        girl: ["يسرى", "ياسمين", "يمنى"],
        animal: ["يمامة", "يحمور"],
        object: ["ينبوع", "يد"],
        plant: ["ياسمين", "يقطين"],
        country: ["اليونان", "اليمن", "اليابان"]
      }
    };

    // حرف الغين
    dictionary["غ"] = {
      boy: ["غانم", "غازي"],
      girl: ["غادة", "غزل"],
      animal: ["غزال", "غراب"],
      object: ["غطاء", "غربال"],
      plant: ["غار", "غصن"],
      country: ["غانا", "غينيا"]
    };

    const allLetters = Object.keys(dictionary);
    let currentLetter = "أ";
    let startTime = null;
    let timerInterval = null;
    let totalScore = 0;
    let timeLeft = 240; // 4 دقايق = 240 ثانية

    // تطبيع النص العربي (إزالة التشكيل والمسافات الزائدة)
    function normalize(text) {
      if (!text) return "";
      return text
        .trim()
        .replace(/[\u064B-\u065F]/g, "") // تشكيل
        .replace(/أ|إ|آ/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function startsWithLetter(word, letter) {
      if (!word) return false;
      const nWord = normalize(word);
      const nLetter = normalize(letter);
      // تعامل خاص مع الألف
      if (nLetter === "ا") {
        return nWord.startsWith("ا") || nWord.startsWith("أ") || nWord.startsWith("إ") || nWord.startsWith("آ");
      }
      return nWord.startsWith(nLetter);
    }

    function isValidWord(word, category, letter) {
      if (!word || word.trim().length < 2) return false;
      if (!startsWithLetter(word, letter)) return false;

      const list = dictionary[letter]?.[category] || [];
      const nWord = normalize(word);

      // قبول إذا تطابق مع أي كلمة في القائمة (بعد التطبيع)
      return list.some(item => normalize(item) === nWord || normalize(item).includes(nWord) || nWord.includes(normalize(item)));
    }

    function startGame() {
      document.getElementById("letter-picker").style.display = "none";
      document.getElementById("game-screen").style.display = "block";
      document.getElementById("current-letter").textContent = currentLetter;
      resetForm();
      startTimer();
    }

    function showLetterPicker() {
      document.getElementById("letter-picker").style.display = "block";
      document.getElementById("game-screen").style.display = "none";
      const grid = document.getElementById("letters-grid");
      grid.innerHTML = "";
      allLetters.forEach(l => {
        const btn = document.createElement("button");
        btn.className = "letter-btn";
        btn.textContent = l;
        btn.onclick = () => {
          currentLetter = l;
          startGame();
        };
        grid.appendChild(btn);
      });
    }

    function resetForm() {
      ["boy", "girl", "animal", "object", "plant", "country"].forEach(id => {
        const input = document.getElementById(id);
        input.value = "";
        input.classList.remove("valid", "invalid");
        document.getElementById("hint-" + id).textContent = "";
        document.getElementById("hint-" + id).className = "hint";
      });
      document.getElementById("result-box").className = "result-box";
      document.getElementById("result-box").textContent = "";
    }

    function startTimer() {
      timeLeft = 240; // 4 دقايق
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          stopTimer();
          timeUp();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = String(Math.floor(timeLeft / 60)).padStart(2, "0");
      const sec = String(timeLeft % 60).padStart(2, "0");
      const timerEl = document.getElementById("timer");
      timerEl.textContent = `${min}:${sec}`;
      if (timeLeft <= 30) {
        timerEl.style.color = "#ef4444";
      } else {
        timerEl.style.color = "";
      }
    }

    function timeUp() {
      const resultBox = document.getElementById("result-box");
      resultBox.className = "result-box show fail";
      resultBox.textContent = "⏰ انتهى الوقت! اضغط أتوبيس كومبليت عشان تشوف نتيجتك";
      checkAnswers();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function checkAnswers() {
      const letter = currentLetter;
      const fields = [
        { id: "boy", cat: "boy", label: "اسم ولد" },
        { id: "girl", cat: "girl", label: "اسم بنت" },
        { id: "animal", cat: "animal", label: "حيوان" },
        { id: "object", cat: "object", label: "جماد" },
        { id: "plant", cat: "plant", label: "نبات" },
        { id: "country", cat: "country", label: "بلد" }
      ];

      let correct = 0;
      let filled = 0;

      fields.forEach(f => {
        const input = document.getElementById(f.id);
        const val = input.value.trim();
        const hint = document.getElementById("hint-" + f.id);

        if (!val) {
          input.classList.remove("valid", "invalid");
          hint.textContent = "";
          return;
        }
        filled++;

        const startsOk = startsWithLetter(val, letter);
        const inDict = isValidWord(val, f.cat, letter);

        if (startsOk && inDict) {
          input.classList.add("valid");
          input.classList.remove("invalid");
          hint.textContent = "✓ صحيحة وموجودة في القاموس";
          hint.className = "hint ok";
          correct++;
        } else if (startsOk) {
          input.classList.add("valid");
          input.classList.remove("invalid");
          hint.textContent = "✓ تبدأ بالحرف (مقبولة)";
          hint.className = "hint ok";
          correct++;
        } else {
          input.classList.add("invalid");
          input.classList.remove("valid");
          hint.textContent = "✗ لا تبدأ بالحرف " + letter;
          hint.className = "hint err";
        }
      });

      const resultBox = document.getElementById("result-box");
      resultBox.classList.add("show");

      if (filled === 0) {
        resultBox.className = "result-box show fail";
        resultBox.textContent = "اكتب إجابات أولًا!";
        return;
      }

      // حساب النقاط (كل إجابة صحيحة = 10 نقاط)
      const points = correct * 10;
      totalScore += points;
      document.getElementById("score").textContent = totalScore;

      if (correct === 6) {
        resultBox.className = "result-box show success";
        resultBox.textContent = `🎉 أتوبيس كومبليت! كل الإجابات صحيحة (+${points} نقطة)`;
        stopTimer();
      } else if (correct >= 4) {
        resultBox.className = "result-box show partial";
        resultBox.textContent = `جيد! ${correct} من 6 صحيحة (+${points} نقطة)`;
      } else {
        resultBox.className = "result-box show fail";
        resultBox.textContent = `${correct} من 6 صحيحة. حاول تاني!`;
      }
    }

    // تشغيل أولي - عرض اختيار الحرف مباشرة
    showLetterPicker();
  </script>
</body>
</html>
